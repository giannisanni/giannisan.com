<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>flowers</title>
<meta name="description" content="A bouquet of lilies grown in code and drawn in text.">
<meta property="og:title" content="flowers">
<meta property="og:description" content="Who needs flowers when you can code them?">
<meta property="og:url" content="https://giannisan.com/flowers/">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23000'/%3E%3Ctext x='32' y='46' font-family='monospace' font-size='40' fill='%23e8466e' text-anchor='middle'%3E*%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #8a8f88; overflow: hidden; }
  body { font: 12px/1.4 "IBM Plex Mono", ui-monospace, monospace; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; }
  .ui { position: fixed; left: 16px; right: 16px; display: flex; justify-content: space-between; gap: 16px; pointer-events: none; }
  .top { top: 14px; } .bottom { bottom: 14px; }
  a { color: inherit; text-decoration: none; pointer-events: auto; }
  a:hover, a:focus-visible, a[aria-current] { color: #f4f5f1; }
  #hint { transition: opacity 1.2s; }
</style>
</head>
<body>
<canvas id="c" role="img" aria-label="An animated bouquet of lilies drawn in ASCII characters"></canvas>
<div class="ui top"><span><a href="./" aria-current="page">lilies</a> · <a href="roses/">roses</a></span><a href="/">giannisan.com</a></div>
<div class="ui bottom"><span id="hint">tap for a new bouquet</span><span id="seed"></span></div>
<script src="ascii.js"></script>
<script>
// Lilies painted to an offscreen canvas (2 px per text cell), then turned into text by ascii.js.
const off = document.createElement('canvas'), o = off.getContext('2d');
const SS = 2;
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
const params = new URLSearchParams(location.search);
const frozen = params.has('t') ? +params.get('t') : null; // ?t=6 renders one fixed moment
const ascii = Ascii(document.getElementById('c'), { fontPx: (W, H) => Math.max(3.6, Math.min(5.5, W / 330)), ramp: " .,:;i1tfLCG08@", lineHeight: 1.15 });

const PALETTE = [ // light, body, tip; spotted?
  [[255,160,130],[236,30,46],[184,12,34], 1],
  [[255,200,235],[232,58,160],[176,30,120], 1],
  [[255,246,170],[250,208,40],[214,150,18], 0],
  [[255,252,240],[244,232,214],[214,196,176], 1],
  [[255,226,170],[246,160,96],[206,104,56], 1],
  [[230,60,70],[150,14,36],[92,4,22], 0],
  [[255,236,246],[246,176,214],[220,90,160], 1],
];

let grid, bouquet, stars, t0, seed;

function rng(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const ease = x => x <= 0 ? 0 : x >= 1 ? 1 : 1 - Math.pow(1 - x, 3);
const rgb = (c, a = 1) => `rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;

function resize() {
  grid = ascii.resize();
  off.width = grid.cols * SS; off.height = grid.rows * SS;
  build();
}

// World units = one cell width; y is stretched by cw/ch at paint time so shapes keep their proportions.
function build() {
  const r = rng(seed);
  const ww = grid.cols, wh = grid.rows * grid.ch / grid.cw;
  const S = Math.min(ww * 0.92 / 0.72, wh * 0.84);         // bouquet height; it is ~0.72 S wide
  const cx = ww / 2, base = wh / 2 + S * 0.5, oy = base - S * 0.6, rx = S * 0.3, ry = S * 0.34;
  const green = () => [40 + r() * 50, 120 + r() * 80, 30 + r() * 40];

  const heads = [];
  for (let i = 0; i < 13; i++) { // best-candidate sampling: even coverage of the oval, still organic
    let best, bd = -1;
    for (let k = 0; k < 24; k++) {
      const a = r() * 6.283, d = Math.sqrt(r()), p = [cx + Math.cos(a) * rx * d, oy + Math.sin(a) * ry * d];
      const md = Math.min(...heads.map(h => Math.hypot(h[0] - p[0], h[1] - p[1])), 1e9);
      if (md > bd) { bd = md; best = p; }
    }
    heads.push(best);
  }
  const stems = [], flowers = [], leaves = [], buds = [];
  const stemTo = (hx, hy, d) => {
    const sx = cx + (r() - 0.5) * S * 0.07;
    const s = { x0: sx, y0: base, x1: hx, y1: hy, kx: sx + (hx - sx) * 0.15, ky: hy + (base - hy) * 0.55, col: green(), d, ph: r() * 6.28 };
    stems.push(s); return s;
  };
  const off0 = (r() * PALETTE.length) | 0; // cycle the palette so every bouquet is mixed
  for (const [i, [hx, hy]] of heads.entries()) {
    const pal = PALETTE[(off0 + i * 3) % PALETTE.length];
    flowers.push({ stem: stemTo(hx, hy, r() * 0.5), L: S * (0.15 + r() * 0.05), pal, rot: r() * 6.28, axis: r() * 6.28, squash: 0.5 + r() * 0.5,
      d: 1.4 + r() * 2.2, spots: pal[3] ? Array.from({ length: 5 }, () => [0.12 + r() * 0.3, (r() - 0.5) * 0.5]) : [] });
  }
  for (let i = 0; i < 5; i++) {
    const a = -Math.PI / 2 + (r() - 0.5) * 2.2;
    buds.push({ stem: stemTo(cx + Math.cos(a) * rx * 1.05, oy + Math.sin(a) * ry * 1.05, r() * 0.6), L: S * (0.06 + r() * 0.03), pal: PALETTE[(r() * PALETTE.length) | 0], d: 2 + r() * 2 });
  }
  for (let i = 0; i < 14; i++) {
    const a = -Math.PI / 2 + (r() - 0.5) * 2;
    leaves.push({ x: cx + (r() - 0.5) * S * 0.14, y: base, a, len: S * (0.1 + r() * 0.16), w: S * (0.008 + r() * 0.01), bend: (a + Math.PI / 2) * 0.7, col: green(), d: r() * 0.8, ph: r() * 6.28 });
  }
  for (const s of stems) if (r() < 0.7) { // a broad leaf partway up the stem
    const u = 0.3 + r() * 0.35, side = r() < 0.5 ? -1 : 1, d = s.d + 0.6 + u;
    leaves.push({ stem: s, u, a: -Math.PI / 2 + side * (0.5 + r() * 0.5), len: S * (0.1 + r() * 0.08), w: S * (0.014 + r() * 0.01), bend: side * 0.5, col: green(), d, ph: r() * 6.28 });
  }
  flowers.sort((a, b) => a.stem.y1 - b.stem.y1); // lower heads overlap the ones above them
  bouquet = { S, stems, flowers, leaves, buds };
  stars = Array.from({ length: Math.round(grid.cols * grid.rows / 140) }, () => [r() * grid.cols | 0, r() * grid.rows | 0, r() * 6.28, 0.3 + r() * 1.2]);
  t0 = performance.now();
  document.getElementById('seed').textContent = '#' + seed;
}

function quad(s, u, sway) {
  const v = 1 - u, x1 = s.x1 + sway, kx = s.kx + sway * 0.3;
  return [v * v * s.x0 + 2 * v * u * kx + u * u * x1, v * v * s.y0 + 2 * v * u * s.ky + u * u * s.y1];
}
const swayOf = (s, t) => still ? 0 : Math.sin(t * 0.7 + s.ph) * bouquet.S * 0.008;

function petal(f, L, w, pal, a) {
  o.save(); o.rotate(a);
  for (const side of [-1, 1]) { // two halves folded along the midrib: one catches the light, one is in shade
    const k = side < 0 ? 1 : 0.68, gr = o.createLinearGradient(0, 0, L, 0);
    gr.addColorStop(0, rgb([pal[1][0] * 0.3 + 40, pal[1][1] * 0.3 + 50, 22]));
    gr.addColorStop(0.16, rgb(pal[0].map(v => v * k))); gr.addColorStop(0.5, rgb(pal[1].map(v => v * k))); gr.addColorStop(1, rgb(pal[2].map(v => v * k)));
    o.fillStyle = gr;
    o.beginPath(); o.moveTo(0, 0);
    o.bezierCurveTo(L * 0.22, w * side, L * 0.68, w * 0.85 * side, L, w * 0.12);
    o.quadraticCurveTo(L * 0.5, -w * 0.04, 0, 0);
    o.fill();
    o.strokeStyle = rgb(pal[2].map(v => v * 0.55 * k), 0.8); o.lineWidth = L * 0.014;
    for (const v of [0.3, 0.6]) { o.beginPath(); o.moveTo(L * 0.1, 0); o.quadraticCurveTo(L * 0.45, w * v * side, L * 0.85, w * v * 0.35 * side); o.stroke(); }
  }
  o.strokeStyle = rgb(pal[0], 0.8); o.lineWidth = L * 0.018;
  o.beginPath(); o.moveTo(L * 0.08, 0); o.quadraticCurveTo(L * 0.5, -w * 0.04, L * 0.93, w * 0.1); o.stroke();
  o.strokeStyle = 'rgba(0,0,0,0.6)'; o.lineWidth = L * 0.02;
  o.beginPath(); o.moveTo(0, 0); o.bezierCurveTo(L * 0.22, -w, L * 0.68, -w * 0.85, L, w * 0.12); o.bezierCurveTo(L * 0.68, w * 0.85, L * 0.22, w, 0, 0); o.stroke();
  o.fillStyle = rgb(pal[2].map(v => v * 0.4));
  for (const [u, v] of f.spots) { o.beginPath(); o.arc(L * u, w * v * (1 - u), L * 0.02, 0, 6.29); o.fill(); }
  o.restore();
}

function paint(t) {
  const { S, stems, flowers, leaves, buds } = bouquet, { cw, ch } = grid;
  o.setTransform(1, 0, 0, 1, 0, 0);
  o.fillStyle = '#000'; o.fillRect(0, 0, off.width, off.height);
  o.setTransform(SS, 0, 0, SS, 0, 0);
  for (const [x, y, p, sp] of stars) { // twinkling one-cell stars
    const a = still ? 0.4 : (0.5 + 0.5 * Math.sin(t * sp + p)) * Math.min(1, t / 3);
    if (a > 0.2) { o.fillStyle = `rgba(190,200,230,${a * 0.5})`; o.fillRect(x, y, 1, 1); }
  }
  o.setTransform(SS, 0, 0, SS * cw / ch, 0, 0);
  o.lineCap = 'round';

  for (const l of leaves) {
    const gk = ease((t - l.d) / 1.6); if (!gk) continue;
    if (l.stem) [l.x, l.y] = quad(l.stem, l.u, swayOf(l.stem, t));
    const a = l.a + (still ? 0 : Math.sin(t * 0.9 + l.ph) * 0.03), len = l.len * gk, N = 12, Lp = [], Rp = [];
    for (let i = 0; i <= N; i++) {
      const u = i / N, ang = a + l.bend * u * u;
      const px = l.x + Math.cos(a) * len * u + Math.cos(ang) * len * u * u * 0.3;
      const py = l.y + Math.sin(a) * len * u + Math.sin(ang) * len * u * u * 0.3;
      const hw = l.w * Math.sin(Math.PI * Math.min(1, u * 1.15)) * (1 - u * 0.4);
      Lp.push([px - Math.sin(ang) * hw, py + Math.cos(ang) * hw]); Rp.push([px + Math.sin(ang) * hw, py - Math.cos(ang) * hw]);
    }
    const gr = o.createLinearGradient(l.x, l.y, Lp[N][0], Lp[N][1]);
    gr.addColorStop(0, rgb(l.col.map(v => v * 0.5))); gr.addColorStop(1, rgb(l.col.map(v => Math.min(255, v * 1.35))));
    o.fillStyle = gr; o.beginPath(); o.moveTo(...Lp[0]);
    for (const p of Lp) o.lineTo(...p);
    for (const p of Rp.reverse()) o.lineTo(...p);
    o.fill();
  }

  for (const s of stems) {
    const gk = ease((t - s.d) / 1.8); if (!gk) continue;
    const sw = swayOf(s, t);
    o.strokeStyle = rgb(s.col); o.lineWidth = S * 0.006;
    o.beginPath(); o.moveTo(s.x0, s.y0);
    for (let i = 1; i <= 24; i++) o.lineTo(...quad(s, gk * i / 24, sw));
    o.stroke();
  }

  for (const b of buds) {
    const gk = ease((t - b.d) / 1.5); if (!gk) continue;
    const s = b.stem, sw = swayOf(s, t), [x, y] = quad(s, 1, sw), [px, py] = quad(s, 0.95, sw);
    o.save(); o.translate(x, y); o.rotate(Math.atan2(y - py, x - px));
    const gr = o.createLinearGradient(0, 0, b.L, 0);
    gr.addColorStop(0, rgb(s.col)); gr.addColorStop(1, rgb(b.pal[1]));
    o.fillStyle = gr; o.beginPath(); o.ellipse(b.L * 0.5 * gk, 0, b.L * 0.55 * gk, b.L * 0.17 * gk, 0, 0, 6.29); o.fill();
    o.restore();
  }

  for (const f of flowers) {
    const s = f.stem, sw = swayOf(s, t);
    if (ease((t - s.d) / 1.8) < 1) continue;
    const bloom = ease((t - f.d) / 2.2), [x, y] = quad(s, 1, sw);
    o.save(); o.translate(x, y);
    if (bloom < 0.2) {
      o.fillStyle = rgb(f.pal[1]); o.beginPath(); o.ellipse(0, -f.L * 0.2, f.L * 0.1, f.L * 0.28, 0, 0, 6.29); o.fill();
      o.restore(); continue;
    }
    const open = (bloom - 0.2) / 0.8, L = f.L * (0.3 + 0.7 * open), rot = f.rot + (still ? 0 : Math.sin(t * 0.3 + s.ph) * 0.04);
    o.rotate(f.axis); o.scale(1, f.squash); o.rotate(-f.axis);
    for (let k = 0; k < 6; k += 2) petal(f, L, L * 0.27, f.pal.map((c, i) => i < 3 ? c.map(v => v * 0.85) : c), rot + k * Math.PI / 3);
    for (let k = 1; k < 6; k += 2) petal(f, L * 1.06, L * 0.33, f.pal, rot + k * Math.PI / 3);
    o.lineWidth = L * 0.02;
    for (let k = 0; k < 6; k++) {
      const a = rot + k * Math.PI / 3 + 0.45 + (k % 2) * 0.2, sl = L * (0.55 + 0.12 * (k % 3)) * open;
      o.strokeStyle = 'rgb(205,225,170)'; o.beginPath(); o.moveTo(0, 0); o.quadraticCurveTo(Math.cos(a) * sl * 0.6, Math.sin(a) * sl * 0.6 - L * 0.08, Math.cos(a) * sl, Math.sin(a) * sl); o.stroke();
      o.fillStyle = 'rgb(130,50,20)'; o.beginPath(); o.ellipse(Math.cos(a) * sl, Math.sin(a) * sl, L * 0.065, L * 0.025, a + 1.57, 0, 6.29); o.fill();
    }
    o.restore();
  }
}

function frame(now) {
  const t = frozen ?? (still ? 99 : (now - t0) / 1000);
  paint(t);
  ascii.draw(off);
  if (!still && frozen === null) requestAnimationFrame(frame);
}

function regrow() {
  seed = (Math.random() * 1e6) | 0;
  build();
  document.getElementById('hint').style.opacity = 0;
  if (still || frozen !== null) frame(performance.now());
}

seed = params.has('seed') ? +params.get('seed') | 0 : (Math.random() * 1e6) | 0;
addEventListener('resize', () => { resize(); if (still || frozen !== null) frame(performance.now()); });
addEventListener('click', e => { if (!e.target.closest('a')) regrow(); });
addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') regrow(); });
document.fonts.load('500 10px "IBM Plex Mono"').catch(() => {}).then(() => { resize(); requestAnimationFrame(frame); });
</script>
</body>
</html>
