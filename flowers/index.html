<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>flowers</title>
<meta name="description" content="A bouquet of lilies grown in code and drawn in text.">
<meta property="og:title" content="flowers">
<meta property="og:description" content="Who needs flowers when you can code them?">
<meta property="og:url" content="https://giannisan.com/flowers/">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23000'/%3E%3Ctext x='32' y='46' font-family='monospace' font-size='40' fill='%23e8466e' text-anchor='middle'%3E*%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #8a8f88; overflow: hidden; }
  body { font: 12px/1.4 "IBM Plex Mono", ui-monospace, monospace; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; }
  .ui { position: fixed; left: 16px; right: 16px; display: flex; justify-content: space-between; pointer-events: none; }
  .top { top: 14px; } .bottom { bottom: 14px; }
  a { color: inherit; text-decoration: none; pointer-events: auto; }
  a:hover, a:focus-visible { color: #f4f5f1; }
  #hint { transition: opacity 1.2s; }
</style>
</head>
<body>
<canvas id="c" role="img" aria-label="An animated bouquet of lilies drawn in ASCII characters"></canvas>
<div class="ui top"><span>flowers</span><a href="/">giannisan.com</a></div>
<div class="ui bottom"><span id="hint">tap for a new bouquet</span><span id="seed"></span></div>
<script>
// A lily bouquet painted to a tiny offscreen canvas, then re-drawn as coloured text:
// luminance picks the glyph, Sobel edges swap in - \ | / along outlines.
const cv = document.getElementById('c'), g = cv.getContext('2d');
const off = document.createElement('canvas'), o = off.getContext('2d', { willReadFrequently: true });
const RAMP = " .:;+*oxO%#@";
const EDGE = ['-', '\\', '|', '/'];
const SS = 2; // offscreen supersampling per cell
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;

const PALETTE = [ // throat, body, edge
  [[255,205,95],[228,32,48],[165,12,32]],
  [[255,238,246],[236,72,162],[196,38,128]],
  [[255,242,150],[250,206,42],[232,158,22]],
  [[255,251,238],[246,228,210],[226,186,166]],
  [[255,222,125],[250,142,52],[218,92,30]],
  [[255,242,214],[240,182,142],[212,138,110]],
  [[226,70,90],[150,16,42],[98,6,26]],
];

let W, H, cols, rows, cw, ch, font, bouquet, stars, t0, seed;

function rng(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const ease = x => x <= 0 ? 0 : x >= 1 ? 1 : 1 - Math.pow(1 - x, 3);
const rgb = (c, a = 1) => `rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;

function resize() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const fs = Math.max(5, Math.min(9, Math.sqrt(W * H / 32000))) // ~45k cells max; ponytail: fillText per cell, glyph atlas if it ever stutters;
  font = `500 ${fs}px "IBM Plex Mono", ui-monospace, monospace`;
  g.font = font;
  cw = g.measureText('M').width; ch = fs * 1.05;
  cols = Math.ceil(W / cw); rows = Math.ceil(H / ch);
  off.width = cols * SS; off.height = rows * SS;
  build();
}

// World units = one cell width; y is stretched so shapes keep their real proportions.
function build() {
  const r = rng(seed);
  const ww = cols, wh = rows * ch / cw;
  const S = Math.min(ww * 0.92, wh * 0.84);
  const cx = ww / 2, base = wh * 0.94 - Math.max(0, wh * 0.78 - S) * 0.35;
  const pick = () => PALETTE[(r() * PALETTE.length) | 0];
  const green = () => [40 + r() * 40, 120 + r() * 70, 40 + r() * 35];

  const stems = [], flowers = [], leaves = [], buds = [];
  const n = 7 + ((r() * 3) | 0);
  for (let i = 0; i < n; i++) {
    const a = Math.PI * (0.08 + 0.84 * (i + r() * 0.8) / n);
    const rad = Math.sqrt(0.25 + r() * 0.75);
    const hx = cx - Math.cos(a) * S * 0.42 * rad, hy = base - S * 0.6 - Math.sin(a) * S * 0.34 * rad + (r() - 0.5) * S * 0.08;
    const sx = cx + (r() - 0.5) * S * 0.06;
    const stem = { x0: sx, y0: base, x1: hx, y1: hy, kx: (sx + hx) / 2 + (r() - 0.5) * S * 0.08, ky: (base + hy) / 2, col: green(), d: r() * 0.6, ph: r() * 6.28 };
    stems.push(stem);
    flowers.push({ stem, L: S * (0.11 + r() * 0.05), pal: pick(), rot: r() * 6.28, axis: r() * 6.28, squash: 0.78 + r() * 0.22, d: 1.6 + r() * 1.8 });
  }
  for (let i = 0; i < 5; i++) {
    const side = i % 2 ? 1 : -1, hx = cx + side * S * (0.1 + r() * 0.36), hy = base - S * (0.72 + r() * 0.2);
    const sx = cx + (r() - 0.5) * S * 0.05;
    const stem = { x0: sx, y0: base, x1: hx, y1: hy, kx: (sx + hx) / 2, ky: (base + hy) / 2, col: green(), d: r() * 0.8, ph: r() * 6.28 };
    stems.push(stem);
    buds.push({ stem, L: S * (0.05 + r() * 0.035), pal: pick(), d: 2.5 + r() * 2 });
  }
  for (let i = 0; i < 22; i++) {
    const a = -Math.PI / 2 + (r() - 0.5) * 2.1;
    leaves.push({ x: cx + (r() - 0.5) * S * 0.12, y: base, a, len: S * (0.18 + r() * 0.3), w: S * (0.014 + r() * 0.018), bend: (a + Math.PI / 2) * 0.6, col: green(), d: r() * 0.9, ph: r() * 6.28 });
  }
  flowers.sort((a, b) => a.L - b.L); // small ones read as further back
  bouquet = { S, stems, flowers, leaves, buds };
  stars = Array.from({ length: Math.round(cols * rows / 90) }, () => ({ c: (r() * cols) | 0, r: (r() * rows) | 0, p: r() * 6.28, s: 0.3 + r() * 1.2 }));
  t0 = performance.now();
  document.getElementById('seed').textContent = '#' + (seed >>> 0).toString(16).slice(-5);
}

function quad(s, u, sway) {
  const v = 1 - u, x1 = s.x1 + sway, kx = s.kx + sway * 0.4;
  return [v * v * s.x0 + 2 * v * u * kx + u * u * x1, v * v * s.y0 + 2 * v * u * s.ky + u * u * s.y1];
}
const swayOf = (s, t) => still ? 0 : Math.sin(t * 0.7 + s.ph) * bouquet.S * 0.012;

function petal(L, w, pal, a) {
  o.save(); o.rotate(a);
  const gr = o.createLinearGradient(0, 0, L, 0);
  gr.addColorStop(0, rgb(pal[0])); gr.addColorStop(0.32, rgb(pal[1])); gr.addColorStop(1, rgb(pal[2]));
  o.fillStyle = gr;
  o.beginPath(); o.moveTo(0, 0);
  o.bezierCurveTo(L * 0.25, -w, L * 0.7, -w * 0.9, L, 0);
  o.bezierCurveTo(L * 0.7, w * 0.9, L * 0.25, w, 0, 0);
  o.fill();
  o.strokeStyle = 'rgba(0,0,0,0.7)'; o.lineWidth = L * 0.035; o.stroke();
  o.strokeStyle = rgb(pal[0], 0.55); o.lineWidth = L * 0.03;
  o.beginPath(); o.moveTo(L * 0.1, 0); o.quadraticCurveTo(L * 0.5, -w * 0.08, L * 0.85, 0); o.stroke();
  o.restore();
}

function paint(t) {
  const { S, stems, flowers, leaves, buds } = bouquet;
  o.setTransform(1, 0, 0, 1, 0, 0);
  o.fillStyle = '#000'; o.fillRect(0, 0, off.width, off.height);
  o.setTransform(SS, 0, 0, SS * cw / ch, 0, 0);
  o.lineCap = 'round';

  for (const l of leaves) {
    const gk = ease((t - l.d) / 1.6); if (!gk) continue;
    const sw = still ? 0 : Math.sin(t * 0.9 + l.ph) * 0.04;
    const len = l.len * gk, a = l.a + sw, N = 12, L = [], R = [];
    for (let i = 0; i <= N; i++) {
      const u = i / N, ang = a + l.bend * u * u;
      const px = l.x + Math.cos(a) * len * u + Math.cos(ang) * len * u * u * 0.3;
      const py = l.y + Math.sin(a) * len * u + Math.sin(ang) * len * u * u * 0.3;
      const hw = l.w * Math.sin(Math.PI * Math.min(1, u * 1.15)) * (1 - u * 0.4);
      L.push([px - Math.sin(ang) * hw, py + Math.cos(ang) * hw]); R.push([px + Math.sin(ang) * hw, py - Math.cos(ang) * hw]);
    }
    const gr = o.createLinearGradient(l.x, l.y, L[N][0], L[N][1]);
    gr.addColorStop(0, rgb(l.col.map(v => v * 0.6))); gr.addColorStop(1, rgb(l.col.map(v => Math.min(255, v * 1.25))));
    o.fillStyle = gr; o.beginPath(); o.moveTo(...L[0]);
    for (const p of L) o.lineTo(...p);
    for (const p of R.reverse()) o.lineTo(...p);
    o.fill();
  }

  for (const s of stems) {
    const gk = ease((t - s.d) / 1.8); if (!gk) continue;
    const sw = swayOf(s, t);
    o.strokeStyle = rgb(s.col); o.lineWidth = S * 0.011;
    o.beginPath(); o.moveTo(s.x0, s.y0);
    for (let i = 1; i <= 24; i++) o.lineTo(...quad(s, gk * i / 24, sw));
    o.stroke();
  }

  for (const b of buds) {
    const gk = ease((t - b.d) / 1.5); if (!gk) continue;
    const s = b.stem, sw = swayOf(s, t), [x, y] = quad(s, 1, sw), [px, py] = quad(s, 0.96, sw);
    o.save(); o.translate(x, y); o.rotate(Math.atan2(y - py, x - px));
    const gr = o.createLinearGradient(0, 0, b.L, 0);
    gr.addColorStop(0, rgb(s.col)); gr.addColorStop(1, rgb(b.pal[1]));
    o.fillStyle = gr; o.beginPath(); o.ellipse(b.L * 0.5 * gk, 0, b.L * 0.55 * gk, b.L * 0.16 * gk, 0, 0, 6.29); o.fill();
    o.restore();
  }

  for (const f of flowers) {
    const s = f.stem, sw = swayOf(s, t), gk = ease((t - s.d) / 1.8);
    if (gk < 1) continue;
    const bloom = ease((t - f.d) / 2.2), [x, y] = quad(s, 1, sw);
    o.save(); o.translate(x, y);
    if (bloom < 0.25) { // still a bud on top of the stem
      o.fillStyle = rgb(f.pal[1]); o.beginPath(); o.ellipse(0, -f.L * 0.2, f.L * 0.12, f.L * 0.3, 0, 0, 6.29); o.fill();
      o.restore(); continue;
    }
    const open = (bloom - 0.25) / 0.75, L = f.L * (0.35 + 0.65 * open), rot = f.rot + (still ? 0 : Math.sin(t * 0.3 + s.ph) * 0.05);
    o.rotate(f.axis); o.scale(1, f.squash); o.rotate(-f.axis);
    for (let k = 0; k < 6; k += 2) petal(L, L * 0.3, f.pal.map(c => c.map(v => v * 0.86)), rot + k * Math.PI / 3);
    for (let k = 1; k < 6; k += 2) petal(L * 1.04, L * 0.36, f.pal, rot + k * Math.PI / 3);
    o.fillStyle = 'rgb(200,230,140)'; o.beginPath(); o.arc(0, 0, L * 0.09, 0, 6.29); o.fill();
    o.lineWidth = L * 0.025;
    for (let k = 0; k < 6; k++) {
      const a = rot + k * Math.PI / 3 + 0.5, sl = L * 0.55 * open;
      o.strokeStyle = 'rgb(225,235,190)'; o.beginPath(); o.moveTo(0, 0); o.lineTo(Math.cos(a) * sl, Math.sin(a) * sl); o.stroke();
      o.fillStyle = 'rgb(150,60,20)'; o.beginPath(); o.ellipse(Math.cos(a) * sl, Math.sin(a) * sl, L * 0.07, L * 0.03, a + 1.57, 0, 6.29); o.fill();
    }
    o.restore();
  }
}

function draw(now) {
  const t = (now - t0) / 1000;
  paint(still ? 99 : t);
  const px = o.getImageData(0, 0, off.width, off.height).data, ow = off.width;
  const n = cols * rows, R = new Float32Array(n), G = new Float32Array(n), B = new Float32Array(n), Y = new Float32Array(n);
  for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
    let r = 0, gg = 0, b = 0;
    for (let j = 0; j < SS; j++) for (let i = 0; i < SS; i++) { const p = ((y * SS + j) * ow + x * SS + i) * 4; r += px[p]; gg += px[p + 1]; b += px[p + 2]; }
    const k = y * cols + x, q = SS * SS;
    R[k] = r / q; G[k] = gg / q; B[k] = b / q;
    Y[k] = (0.299 * R[k] + 0.587 * G[k] + 0.114 * B[k]) / 255;
  }
  g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
  g.font = font; g.textBaseline = 'top';

  for (const s of stars) {
    const k = s.r * cols + s.c; if (Y[k] > 0.04) continue;
    const a = still ? 0.4 : (0.5 + 0.5 * Math.sin(t * s.s + s.p)) * Math.min(1, t / 3);
    if (a < 0.15) continue;
    g.fillStyle = `rgba(200,205,220,${a * 0.6})`; g.fillText(a > 0.85 ? '+' : '.', s.c * cw, s.r * ch);
  }

  const nr = RAMP.length;
  for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
    const k = y * cols + x, l = Y[k]; if (l < 0.05) continue;
    let glyph = RAMP[Math.min(nr - 1, Math.max(1, (l * (nr - 1) + 0.5) | 0))];
    if (x > 0 && y > 0 && x < cols - 1 && y < rows - 1 && l > 0.12) {
      const gx = Y[k - cols + 1] + 2 * Y[k + 1] + Y[k + cols + 1] - Y[k - cols - 1] - 2 * Y[k - 1] - Y[k + cols - 1];
      const gy = Y[k + cols - 1] + 2 * Y[k + cols] + Y[k + cols + 1] - Y[k - cols - 1] - 2 * Y[k - cols] - Y[k - cols + 1];
      if (Math.hypot(gx, gy) / 4 > 0.5) glyph = EDGE[(((Math.atan2(gy, gx) * 180 / Math.PI + 90 + 22.5) % 180 + 180) % 180 / 45) | 0];
    }
    const v = Math.max(R[k], G[k], B[k], 1), m = Math.min(255 / v, 1.35); // brighten, keep shading
    g.fillStyle = `rgb(${Math.min(255, R[k] * m) | 0},${Math.min(255, G[k] * m) | 0},${Math.min(255, B[k] * m) | 0})`;
    g.fillText(glyph, x * cw, y * ch);
  }
  if (!still) requestAnimationFrame(draw);
}

function regrow() {
  seed = (Math.random() * 2 ** 32) >>> 0;
  build();
  document.getElementById('hint').style.opacity = 0;
  if (still) draw(performance.now());
}

seed = +(new URLSearchParams(location.search).get('seed') || (Math.random() * 2 ** 32)) >>> 0;
addEventListener('resize', () => { resize(); if (still) draw(performance.now()); });
addEventListener('click', e => { if (!e.target.closest('a')) regrow(); });
addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') regrow(); });
document.fonts.ready.then(() => { resize(); requestAnimationFrame(draw); });
</script>
</body>
</html>
